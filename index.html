<!DOCTYPE html>
<html lang="kaa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top Qaraqalpaqsha Meme GIF Platforması</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; text-align: center; display: flex; flex-direction: column; min-height: 100vh; }
    .content-wrapper { flex: 1; }
    h1 { color: #38bdf8; margin-bottom: 5px; font-size: 2.2rem; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .author-badge { font-size: 1.1rem; color: #f59e0b; font-weight: bold; margin-bottom: 15px; letter-spacing: 1px; }
    p { color: #94a3b8; margin-bottom: 20px; }
    .search-box { display: flex; justify-content: center; gap: 10px; max-width: 600px; margin: 0 auto 25px auto; }
    input { flex: 1; padding: 12px 18px; border-radius: 25px; border: 2px solid #334155; background: #1e293b; color: #fff; font-size: 16px; outline: none; }
    input:focus { border-color: #38bdf8; }
    button { padding: 12px 25px; border-radius: 25px; border: none; background: #0284c7; color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    .tags { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-bottom: 25px; }
    .tag { background: #334155; padding: 8px 16px; border-radius: 15px; font-size: 14px; cursor: pointer; transition: 0.2s; user-select: none; }
    .tag:hover { background: #38bdf8; color: #0f172a; font-weight: bold; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; max-width: 1200px; margin: 0 auto; }
    
    .card { background: #1e293b; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: transform 0.2s; position: relative; }
    .card:hover { transform: translateY(-5px); }
    .card img { width: 100%; height: 200px; object-fit: cover; display: block; background: #334155; cursor: pointer; }
    .card-info { padding: 10px; display: flex; justify-content: space-between; align-items: center; }
    .card p { font-size: 13px; color: #cbd5e1; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; text-align: left; }
    
    .download-btn { background: #0284c7; color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; text-decoration: none; font-weight: bold; transition: 0.2s; display: inline-block; }
    .download-btn:hover { background: #0369a1; }

    /* Fullscreen Modal Styles */
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); align-items: center; justify-content: center; flex-direction: column; }
    .modal img { max-width: 90%; max-height: 70vh; border-radius: 12px; box-shadow: 0 0 20px rgba(56, 189, 248, 0.5); }
    .modal-content { display: flex; flex-direction: column; align-items: center; gap: 15px; }
    .close-btn { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer; background: none; border: none; }
    .close-btn:hover { color: #38bdf8; }

    footer { margin-top: 40px; padding: 20px; border-top: 1px solid #334155; color: #38bdf8; font-size: 15px; font-weight: 600; }
  </style>
</head>
<body>

  <div class="content-wrapper">
    <h1>🔥 TOP MEME GIFLAR</h1>
    <div class="author-badge">Made by Esnazarov. A</div>
    <p>Eń zór, eń kúlkili hám eń ataqlı GIF memelar toplamı!</p>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Meme qıdırıń (cat, dance, anime)..." onkeyup="if(event.key==='Enter') searchGifs()">
      <button onclick="searchGifs()">Qıdırıw</button>
    </div>

    <div class="tags">
      <span class="tag" onclick="quickSearch('')">🔥 Barlıǵı (Top)</span>
      <span class="tag" onclick="quickSearch('cat')">🐱 Pıshıqlar</span>
      <span class="tag" onclick="quickSearch('funny')">😂 Kúlkili</span>
      <span class="tag" onclick="quickSearch('top')">⭐ Alfa / Top</span>
    </div>

    <div class="grid" id="gifGrid">
      <p style="grid-column: 1/-1; color: #94a3b8;">GIF-lar júklenbekte...</p>
    </div>
  </div>

  <!-- Fullscreen Modal -->
  <div id="gifModal" class="modal">
    <button class="close-btn" onclick="closeModal()">&times;</button>
    <div class="modal-content">
      <img id="modalImg" src="" alt="">
      <p id="modalText" style="color:#fff; font-size:18px;"></p>
      <a id="modalDownload" href="" class="download-btn" download="meme.gif" target="_blank">📥 Júklep alıw (Download)</a>
    </div>
  </div>

  <footer>
    Made by Esnazarov. A
  </footer>

  <script>
    // 100% ishlaydigan va xatosiz tasdiqlangan GIF bazasi
    const memeDatabase = [
      { title: "Nyan Cat Rainbow", category: "cat", url: "https://media1.giphy.com/media/sIIhZliB2McAo/giphy.gif" },
      { title: "Cat Vibe Dance", category: "cat", url: "https://media1.giphy.com/media/GeimqsH0TLDt4tScGw/giphy.gif" },
      { title: "GigaChad Alpha", category: "top", url: "https://media1.giphy.com/media/CAYVZA5NRb529kKQUc/giphy.gif" },
      { title: "Leonardo DiCaprio Cheers", category: "top", url: "https://media1.giphy.com/media/g9582DNuQppxC/giphy.gif" },
      { title: "Homer Simpson Bush", category: "funny", url: "https://media1.giphy.com/media/jUwpNzg9IcyrK/giphy.gif" },
      { title: "Confused Travolta", category: "funny", url: "https://media1.giphy.com/media/uUTvp8kgfHem7AmGts/giphy.gif" },
      { title: "Funny Baby Laugh", category: "funny", url: "https://media1.giphy.com/media/10JhviFuU2g3Qs/giphy.gif" },
      { title: "Cat Jamming", category: "cat", url: "https://media1.giphy.com/media/vFKqnCdLPNOKc/giphy.gif" },
      { title: "Minions Laughing", category: "funny", url: "https://media1.giphy.com/media/13CoXDiaCcCoyk/giphy.gif" },
      { title: "Elmo Fire Meme", category: "funny", url: "https://media1.giphy.com/media/QMHoU66sBXqqLqYvGO/giphy.gif" },
      { title: "SpongeBob Mocking", category: "funny", url: "https://media1.giphy.com/media/3oKIP8kNuTJJL3zT0I/giphy.gif" },
      { title: "The Office No", category: "funny", url: "https://media1.giphy.com/media/12XMGIW6HBl5eM/giphy.gif" }
    ];

    function displayGifs(gifs) {
      const grid = document.getElementById('gifGrid');
      grid.innerHTML = '';

      if (gifs.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; color: #94a3b8; font-size: 18px;">Hesh nárse tabılmadı!</p>';
        return;
      }

      gifs.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${item.url}" alt="${item.title}" loading="lazy" onclick="openModal('${item.url}', '${item.title}')">
          <div class="card-info">
            <p title="${item.title}">${item.title}</p>
            <a href="${item.url}" download="meme.gif" class="download-btn" target="_blank">📥 Júklew</a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openModal(url, title) {
      const modal = document.getElementById('gifModal');
      document.getElementById('modalImg').src = url;
      document.getElementById('modalText').textContent = title;
      document.getElementById('modalDownload').href = url;
      modal.style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('gifModal').style.display = 'none';
    }

    function searchGifs() {
      const val = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!val) {
        displayGifs(memeDatabase);
        return;
      }
      const filtered = memeDatabase.filter(gif => 
        gif.title.toLowerCase().includes(val) || gif.category.toLowerCase().includes(val)
      );
      displayGifs(filtered);
    }

    function quickSearch(tag) {
      document.getElementById('searchInput').value = tag;
      searchGifs();
    }

    // Dáslepki júklew
    displayGifs(memeDatabase);
  </script>
</body>
</html>
