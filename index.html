<!DOCTYPE html>
<html lang="kaa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top Qaraqalpaqsha Meme GIF Platforması</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; text-align: center; display: flex; flex-direction: column; min-height: 100vh; }
    .content-wrapper { flex: 1; }
    h1 { color: #38bdf8; margin-bottom: 5px; font-size: 2.2rem; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .author-badge { font-size: 1rem; color: #f59e0b; font-weight: bold; margin-bottom: 15px; letter-spacing: 1px; }
    p { color: #94a3b8; margin-bottom: 20px; }
    .search-box { display: flex; justify-content: center; gap: 10px; max-width: 600px; margin: 0 auto 25px auto; }
    input { flex: 1; padding: 12px 18px; border-radius: 25px; border: 2px solid #334155; background: #1e293b; color: #fff; font-size: 16px; outline: none; }
    input:focus { border-color: #38bdf8; }
    button { padding: 12px 25px; border-radius: 25px; border: none; background: #0284c7; color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    .tags { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-bottom: 25px; }
    .tag { background: #334155; padding: 8px 16px; border-radius: 15px; font-size: 14px; cursor: pointer; transition: 0.2s; user-select: none; }
    .tag:hover { background: #38bdf8; color: #0f172a; font-weight: bold; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; max-width: 1200px; margin: 0 auto; }
    .card { background: #1e293b; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: transform 0.2s; }
    .card:hover { transform: translateY(-5px); }
    .card img { width: 100%; height: 200px; object-fit: cover; display: block; background: #334155; }
    .card p { padding: 10px; font-size: 13px; color: #cbd5e1; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    footer { margin-top: 40px; padding: 20px; border-top: 1px solid #334155; color: #38bdf8; font-size: 15px; font-weight: 600; }
  </style>
</head>
<body>

  <div class="content-wrapper">
    <h1>🔥 TOP MEME GIFLAR</h1>
    <div class="author-badge">Made by Esnazarov. A</div>
    <p>Eń zór, eń kúlkili hám eń ataqlı GIF memelar toplamı!</p>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Meme qıdırıń (cat, dance, anime)...">
      <button onclick="searchGifs()">Qıdırıw</button>
    </div>

    <div class="tags">
      <span class="tag" onclick="quickSearch('meme')">🔥 Top Memes</span>
      <span class="tag" onclick="quickSearch('cat meme')">🐱 Pıshıqlar</span>
      <span class="tag" onclick="quickSearch('anime')">⚔️ Anime</span>
      <span class="tag" onclick="quickSearch('gaming')">🎮 Oynaw</span>
      <span class="tag" onclick="quickSearch('funny')">😂 Kúlkili</span>
    </div>

    <div class="grid" id="gifGrid">
      <p style="grid-column: 1/-1; color: #94a3b8;">Júklenbekte...</p>
    </div>
  </div>

  <footer>
    Made by Esnazarov. A
  </footer>

  <script>
    async function loadGifs(query = 'meme') {
      const grid = document.getElementById('gifGrid');
      grid.innerHTML = '<p style="grid-column: 1/-1; color: #94a3b8;">GIF-lar júklenbekte...</p>';
      
      try {
        const res = await fetch(`https://api.giphy.com/v1/gifs/search?api_key=g543uY6cFAh89B0c07vA78N7784L5U5g&q=${encodeURIComponent(query)}&limit=24`);
        const data = await res.json();
        
        grid.innerHTML = '';
        if (data.data && data.data.length > 0) {
          data.data.forEach(item => {
            const imgUrl = item.images.fixed_height.url;
            const title = item.title || query;
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<img src="${imgUrl}" alt="${title}" loading="lazy"><p>${title}</p>`;
            grid.appendChild(card);
          });
        } else {
          grid.innerHTML = '<p style="grid-column: 1/-1;">Hesh nárse tabılmadı!</p>';
        }
      } catch (err) {
        grid.innerHTML = '<p style="grid-column: 1/-1; color: #ef4444;">Júklewde qatelik boldı. İnternetti tekseriń!</p>';
      }
    }

    function searchGifs() {
      const val = document.getElementById('searchInput').value;
      if (val) loadGifs(val);
    }

    function quickSearch(tag) {
      document.getElementById('searchInput').value = tag;
      loadGifs(tag);
    }

    // Dáslepki júklew
    loadGifs('meme');
  </script>
</body>
</html>
