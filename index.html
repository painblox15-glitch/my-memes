<!DOCTYPE html>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; text-align: center; display: flex; flex-direction: column; min-height: 100vh; }
    .content-wrapper { flex: 1; }
    h1 { color: #38bdf8; margin-bottom: 5px; font-size: 2.2rem; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .author-badge { font-size: 1.1rem; color: #f59e0b; font-weight: bold; margin-bottom: 15px; letter-spacing: 1px; }
    p { color: #94a3b8; margin-bottom: 20px; }
    .search-box { display: flex; justify-content: center; gap: 10px; max-width: 600px; margin: 0 auto 25px auto; }
    input { flex: 1; padding: 12px 18px; border-radius: 25px; border: 2px solid #334155; background: #1e293b; color: #fff; font-size: 16px; outline: none; }
    input:focus { border-color: #38bdf8; }
    button { padding: 12px 25px; border-radius: 25px; border: none; background: #0284c7; color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    .tags { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-bottom: 25px; }
    .tag { background: #334155; padding: 8px 16px; border-radius: 15px; font-size: 14px; cursor: pointer; transition: 0.2s; user-select: none; }
    .tag:hover { background: #38bdf8; color: #0f172a; font-weight: bold; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; max-width: 1200px; margin: 0 auto; }
    .card { background: #1e293b; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: transform 0.2s; }
    .card:hover { transform: translateY(-5px); }
    .card img { width: 100%; height: 200px; object-fit: cover; display: block; background: #334155; }
    .card p { padding: 10px; font-size: 13px; color: #cbd5e1; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    footer { margin-top: 40px; padding: 20px; border-top: 1px solid #334155; color: #38bdf8; font-size: 15px; font-weight: 600; }
  </style>
</head>
<body>

  <div class="content-wrapper">
    <h1>🔥 TOP MEME GIFLAR</h1>
    <div class="author-badge">Made by Esnazarov. A</div>
    <p>Eń zór, eń kúlkili hám eń ataqlı GIF memelar toplamı!</p>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Meme qıdırıń (cat, dance, anime)..." onkeyup="if(event.key==='Enter') searchGifs()">
      <button onclick="searchGifs()">Qıdırıw</button>
    </div>

    <div class="tags">
      <span class="tag" onclick="quickSearch('')">🔥 Barlıǵı (Top)</span>
      <span class="tag" onclick="quickSearch('cat')">🐱 Pıshıqlar</span>
      <span class="tag" onclick="quickSearch('anime')">⚔️ Anime</span>
      <span class="tag" onclick="quickSearch('dance')">💃 Oyın</span>
      <span class="tag" onclick="quickSearch('dog')">🐶 Iytler</span>
    </div>

    <div class="grid" id="gifGrid"></div>
  </div>

  <footer>
    Made by Esnazarov. A

  <script>

      { title: "Gojo Sukuna Anime Meme", category: "anime", url: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExeWZsdDFqNm5pOXNpdnV2dnE1ZWtsMGY4MXA1MnBzNXZkOW4yaG15byZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/C21GGDOpKT6Z4VuXyn/giphy.gif" },
      { title: "Anime Dance Meme", category: "anime dance", url: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNmtpODJseXFiOWdpZmV2aXp0MGx2MnN0MnBkb3V1NzNhMXJvZWdrciZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/131tYQapOdbN3G/giphy.gif" },
      { title: "Doge Meme Dog", category: "dog", url: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExdW5vNmQ0YmY0bmcyNWl3eXNodGNiaXQyMXV5YnA0b3gxaDJ4OXFzMCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/o35X61RCMw24/giphy.gif" },

      { title: "Spiderman Dance Meme", category: "dance", url: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp1eHNtdXRhNGRkOW5hYXdrZmdqYWc2NXJsaWNkYndyYmg0dXU1MSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/b3A0yO74M8O0U/giphy.gif" },

      { title: "Pedro Raccoon Dance", category: "dance", url: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNDM2cnlzNDc0bHNsaHBrNTlsZmx0NWQ5dXlxbGllNGhhMzBtbndjbyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/PedroRaccoon/giphy.gif" },

      { title: "Leonardo DiCaprio Cheer", category: "top meme", url: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExMnlzaTFod2Fza2QxYzlsbmJiaTJjZ2hhZzFnZHdzczdrNzBkdGttYiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/g9582DNuQppxC/giphy.gif" }
    ];

    function displayGifs(gifs) {
      const grid = document.getElementById('gifGrid');
      grid.innerHTML = '';

      if (gifs.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; color: #94a3b8; font-size: 18px;">Hesh nárse tabılmadı!</p>';
        return;
      }

      gifs.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${item.url}" alt="${item.title}" loading="lazy">
          <p>${item.title}</p>
        `;
        grid.appendChild(card);
      });
    }

    function searchGifs() {
      const val = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!val) {
        displayGifs(memeDatabase);
        return;
      }
      const filtered = memeDatabase.filter(gif => 
        gif.title.toLowerCase().includes(val) || gif.category.toLowerCase().includes(val)
      );
      displayGifs(filtered);
    }

    function quickSearch(tag) {
      document.getElementById('searchInput').value = tag;
      searchGifs();
    }

    // Dáslepki júklew
    displayGifs(memeDatabase);
  </script>
</body>
</html>
