<!DOCTYPE html>
<html lang="kaa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top Qaraqalpaqsha Meme GIF Platforması</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; text-align: center; display: flex; flex-direction: column; min-height: 100vh; }
    .content-wrapper { flex: 1; }
    h1 { color: #38bdf8; margin-bottom: 5px; font-size: 2.2rem; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .author-badge { font-size: 1.1rem; color: #f59e0b; font-weight: bold; margin-bottom: 15px; letter-spacing: 1px; }
    p { color: #94a3b8; margin-bottom: 20px; }
    .search-box { display: flex; justify-content: center; gap: 10px; max-width: 600px; margin: 0 auto 25px auto; }
    input { flex: 1; padding: 12px 18px; border-radius: 25px; border: 2px solid #334155; background: #1e293b; color: #fff; font-size: 16px; outline: none; }
    input:focus { border-color: #38bdf8; }
    button { padding: 12px 25px; border-radius: 25px; border: none; background: #0284c7; color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    .tags { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-bottom: 25px; }
    .tag { background: #334155; padding: 8px 16px; border-radius: 15px; font-size: 14px; cursor: pointer; transition: 0.2s; user-select: none; }
    .tag:hover { background: #38bdf8; color: #0f172a; font-weight: bold; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; max-width: 1200px; margin: 0 auto; }
    .card { background: #1e293b; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: transform 0.2s; cursor: pointer; }
    .card:hover { transform: translateY(-5px); }
    .card img { width: 100%; height: 200px; object-fit: cover; display: block; background: #334155; }
    .card p { padding: 10px; font-size: 13px; color: #cbd5e1; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    /* Fullscreen Modal Styles */
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); align-items: center; justify-content: center; flex-direction: column; }
    .modal img { max-width: 90%; max-height: 80vh; border-radius: 12px; box-shadow: 0 0 20px rgba(56, 189, 248, 0.5); }
    .modal p { color: #fff; font-size: 20px; margin-top: 15px; }
    .close-btn { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer; background: none; border: none; }
    .close-btn:hover { color: #38bdf8; }

    footer { margin-top: 40px; padding: 20px; border-top: 1px solid #334155; color: #38bdf8; font-size: 15px; font-weight: 600; }
  </style>
</head>
<body>

  <div class="content-wrapper">
    <h1>🔥 TOP MEME GIFLAR</h1>
    <div class="author-badge">Made by Esnazarov. A</div>
    <p>Eń zór, eń kúlkili hám eń ataqlı GIF memelar toplamı! (GIF-tı úlkeytiw ushın onı basıń)</p>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Meme qıdırıń (cat, dance, anime)..." onkeyup="if(event.key==='Enter') searchGifs()">
      <button onclick="searchGifs()">Qıdırıw</button>
    </div>

    <div class="tags">
      <span class="tag" onclick="quickSearch('meme')">🔥 Top Memes</span>
      <span class="tag" onclick="quickSearch('cat')">🐱 Pıshıqlar</span>
      <span class="tag" onclick="quickSearch('anime')">⚔️ Anime</span>
      <span class="tag" onclick="quickSearch('dance')">💃 Oyın</span>
      <span class="tag" onclick="quickSearch('dog')">🐶 Iytler</span>
      <span class="tag" onclick="quickSearch('funny')">😂 Kúlkili</span>
    </div>

    <div class="grid" id="gifGrid">
      <p style="grid-column: 1/-1; color: #94a3b8;">GIF-lar júklenbekte...</p>
    </div>
  </div>

  <!-- Fullscreen Modal -->
  <div id="gifModal" class="modal" onclick="closeModal()">
    <button class="close-btn">&times;</button>
    <img id="modalImg" src="" alt="">
    <p id="modalText"></p>
  </div>

  <footer>
    Made by Esnazarov. A
  </footer>

  <script>
    const fallbackMemes = [
      { title: "Nyan Cat Rainbow", url: "https://media.tenor.com/2roov222Y3wAAAAC/nyan-cat-rainbow.gif" },
      { title: "Cat Vibe Dance", url: "https://media.tenor.com/y2pB_cnbdSQAAAAC/cat-jam.gif" },
      { title: "Pop Cat", url: "https://media.tenor.com/XAS_S9O_RkEAAAAC/pop-cat.gif" },
      { title: "GigaChad Alpha", url: "https://media.tenor.com/d_m9kHw2yA4AAAAC/gigachad-chad.gif" },
      { title: "Doge Happy Smile", url: "https://media.tenor.com/S6e1l9CqL8YAAAAC/doge-dog.gif" },
      { title: "Pedro Raccoon Dance", url: "https://media.tenor.com/1G66p20R8hIAAAAC/pedro-raccoon.gif" },
      { title: "Chill Guy Meme", url: "https://media.tenor.com/6S331nS1_e0AAAAC/chill-guy.gif" },
      { title: "Spiderman Dance", url: "https://media.tenor.com/3N0GgE6P6t8AAAAC/spiderman-dance.gif" },
      { title: "Gojo Satoru Anime", url: "https://media.tenor.com/qU3aN42iM38AAAAC/gojo-satoru-jujutsu-kaisen.gif" },
      { title: "Sukuna Jujutsu Kaisen", url: "https://media.tenor.com/sSsp66O0TVEAAAAC/sukuna-jujutsu-kaisen.gif" },
      { title: "Leonardo DiCaprio Cheers", url: "https://media.tenor.com/x8v1oNUOmg4AAAAC/rick-roll.gif" },
      { title: "Anime Dance Vibing", url: "https://media.tenor.com/4S06253457YAAAAC/anime-dance.gif" }
    ];

    async function loadGifs(query = 'meme') {
      const grid = document.getElementById('gifGrid');
      grid.innerHTML = '<p style="grid-column: 1/-1; color: #94a3b8;">GIF-lar júklenbekte...</p>';
      
      try {
        const res = await fetch(`https://api.giphy.com/v1/gifs/search?api_key=cw95o203lM80M001&q=${encodeURIComponent(query)}&limit=50`);
        const data = await res.json();

        if (data && data.data && data.data.length > 0) {
          renderGrid(data.data.map(item => ({
            title: item.title || query,
            url: item.images.fixed_height.url
          })));
        } else {
          showFallback(query);
        }
      } catch (err) {
        showFallback(query);
      }
    }

    function showFallback(query) {
      const q = query.toLowerCase();
      const filtered = fallbackMemes.filter(item => item.title.toLowerCase().includes(q) || q === 'meme');
      renderGrid(filtered.length > 0 ? filtered : fallbackMemes);
    }

    function renderGrid(items) {
      const grid = document.getElementById('gifGrid');
      grid.innerHTML = '';
      
      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openModal(item.url, item.title);
        card.innerHTML = `
          <img src="${item.url}" alt="${item.title}" loading="lazy" onerror="this.src='https://media.tenor.com/2roov222Y3wAAAAC/nyan-cat-rainbow.gif'">
          <p>${item.title}</p>
        `;
        grid.appendChild(card);
      });
    }

    function openModal(url, title) {
      const modal = document.getElementById('gifModal');
      const modalImg = document.getElementById('modalImg');
      const modalText = document.getElementById('modalText');
      modalImg.src = url;
      modalText.textContent = title;
      modal.style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('gifModal').style.display = 'none';
    }

    function searchGifs() {
      const val = document.getElementById('searchInput').value;
      if (val) loadGifs(val);
    }

    function quickSearch(tag) {
      document.getElementById('searchInput').value = tag;
      loadGifs(tag);
    }

    // Dáslepki júklew
    loadGifs('meme');
  </script>
</body>
</html>
