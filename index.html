<!DOCTYPE html>
<html lang="kaa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top Qaraqalpaqsha Meme GIF Platforması</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; text-align: center; }
    h1 { color: #38bdf8; margin-bottom: 10px; font-size: 2.2rem; }
    p { color: #94a3b8; margin-bottom: 20px; }
    .search-box { display: flex; justify-content: center; gap: 10px; max-width: 600px; margin: 0 auto 25px auto; }
    input { flex: 1; padding: 12px 18px; border-radius: 25px; border: 2px solid #334155; background: #1e293b; color: #fff; font-size: 16px; outline: none; }
    input:focus { border-color: #38bdf8; }
    button { padding: 12px 25px; border-radius: 25px; border: none; background: #0284c7; color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    .tags { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-bottom: 25px; }
    .tag { background: #334155; padding: 6px 14px; border-radius: 15px; font-size: 14px; cursor: pointer; transition: 0.2s; }
    .tag:hover { background: #38bdf8; color: #0f172a; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; max-width: 1200px; margin: 0 auto; }
    .card { background: #1e293b; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: transform 0.2s; }
    .card:hover { transform: translateY(-5px); }
    .card img { width: 100%; height: 200px; object-fit: cover; display: block; }
    .card p { padding: 10px; font-size: 13px; color: #cbd5e1; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>

  <h1>🔥 TOP MEME GIFLAR</h1>
  <p>Eń zór, eń kúlkili hám eń ataqlı GIF memelar toplamı!</p>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Meme qıdıryń (mes: cat, dance, lol)...">
    <button onclick="searchGifs()">Qıdırıw</button>
  </div>

  <div class="tags">
    <span class="tag" onclick="quickSearch('top memes')">🔥 Top Memes</span>
    <span class="tag" onclick="quickSearch('funny cat')">🐱 Pıshıqlar</span>
    <span class="tag" onclick="quickSearch('anime meme')">⚔️ Anime</span>
    <span class="tag" onclick="quickSearch('gaming meme')">🎮 Oynaw</span>
    <span class="tag" onclick="quickSearch('fail')">🤦‍♂️ Fail</span>
  </div>

  <div class="grid" id="gifGrid">
    <p style="grid-column: 1/-1; color: #94a3b8;">GIF'lar júklenbekte...</p>
  </div>

  <script>
    const apiKey = 'LIVDSRZULELA'; // Public Tenor Key

    async function loadGifs(query = 'top memes') {
      const grid = document.getElementById('gifGrid');
      grid.innerHTML = '<p style="grid-column: 1/-1; color: #94a3b8;">Júklenbekte...</p>';
      
      try {
        const res = await fetch(`https://g.tenor.com/v1/search?q=${encodeURIComponent(query)}&key=${apiKey}&limit=24`);
        const data = await res.json();
        
        grid.innerHTML = '';
        if (data.results && data.results.length > 0) {
          data.results.forEach(item => {
            const imgUrl = item.media[0].gif.url;
            const title = item.title || query;
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<img src="${imgUrl}" alt="${title}" loading="lazy"><p>${title}</p>`;
            grid.appendChild(card);
          });
        } else {
          grid.innerHTML = '<p style="grid-column: 1/-1;">Hesh nárse tabılmadı!</p>';
        }
      } catch (err) {
        grid.innerHTML = '<p style="grid-column: 1/-1; color: #ef4444;">GIF-lardı júklewde qatelik boldı. İnternetti tekseriń!</p>';
      }
    }

    function searchGifs() {
      const val = document.getElementById('searchInput').value;
      if (val) loadGifs(val);
    }

    function quickSearch(tag) {
      document.getElementById('searchInput').value = tag;
      loadGifs(tag);
    }

    // Dáslepki júklew
    loadGifs('top memes');
  </script>
</body>
</html>
